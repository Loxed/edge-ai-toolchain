[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edgekit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "torchvision", "matplotlib", "marimo"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]